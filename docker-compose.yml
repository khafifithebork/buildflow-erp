services:
  postgres:
    image: postgres:16-alpine
    container_name: buildflow-postgres
    environment:
      POSTGRES_DB: buildflow
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d buildflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: buildflow-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/buildflow
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Secure by default (disables Swagger/OpenAPI, verbose SQL logging — see
      # application-prod.yml). Override with SPRING_PROFILES_ACTIVE=default
      # in your shell/.env if you need Swagger while developing locally.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"

volumes:
  postgres-data: