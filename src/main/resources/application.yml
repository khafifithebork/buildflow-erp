spring:
  application:
    name: erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/buildflow}
    username: ${DB_USERNAME:buildflow_dev}
    password: ${DB_PASSWORD:devpassword123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  liquibase:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET:buildflow-dev-secret-key-change-in-production-min-32-chars!!}
  expiration-ms: 86400000