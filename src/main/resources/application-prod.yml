# =============================================================================
# Production Profile — application-prod.yml
# =============================================================================
# Activated when SPRING_PROFILES_ACTIVE=prod is set (on Railway).
#
# Spring Boot merges this ON TOP of application.yml. Only values that need
# to DIFFER from development are listed here — everything else is inherited.
# =============================================================================

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  jpa:
    # Don't log every SQL statement in production — it floods the logs
    # and leaks data structure details if logs are ever exposed.
    show-sql: false

  # Liquibase still runs on startup (inherited from application.yml).
  # This is safe: Liquibase changesets are idempotent — if a migration
  # was already applied, it skips it.
